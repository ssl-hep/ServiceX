version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  # Maintain dependencies for poetry. "/*" covers every top-level package
  # directory, including ones added later.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/*"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
