name: Lint and Test Helm Charts

on: [pull_request, workflow_call]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.9.2

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: add bitnami repos to helm
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --chart-dirs ${GITHUB_WORKSPACE}/helm/servicex --charts helm/servicex

      - name: Build chart dependencies
        run: helm dependency build helm/servicex

      - name: Render templates with default values
        run: helm template test helm/servicex > /dev/null

      - name: Render templates with the rucio replica sorter enabled
        run: |
          helm template test helm/servicex \
            --set didFinder.rucio.replicaSorterEnabled=true \
            --set didFinder.rucio.geoIPEdition=GeoLite2-City \
            --set secrets=servicex-secrets \
            --set app.auth=true \
            --set app.tokenExpires=86400 \
            --set transformer.cachePrefix=xcache.example.org:1094 > /dev/null
