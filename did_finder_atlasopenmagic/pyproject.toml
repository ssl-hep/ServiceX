[tool.poetry]
name = "did-finder-atlasopenmagic"
version = "0.1.0"
description = ""
authors = ["Peter Onyisi <ponyisi@utexas.edu>"]
readme = "README.md"
packages = [{include = "did_finder_atlasopenmagic", from = "src"}]

[tool.poetry.dependencies]
python = "~3.14"
atlasopenmagic = "1.8.0"
servicex-did-finder-lib = "^3.2.0-rc.1"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=7.1.3,<10.0.0"
flake8 = "^7.3.0"
pytest-asyncio = "^0.19.0"
coverage = "^6.5.0"
pytest-mock = ">=3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
