apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-servicex-app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-servicex-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-servicex-app
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/app/configmap.yaml") . | sha256sum }}
        {{- if .Values.logging.vector.enabled }}
        checksum/vector-config: {{ include (print $.Template.BasePath "/app/vector-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.app.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ template "servicex.fullname" . }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: check-postgresql
          image: {{ .Values.app.checksImage }}
          env:
        {{- if .Values.secrets }}
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets }}
                  key: postgresql-password
            - name: PG_URI
              value: 'postgresql://postgres:$(PG_PASS)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.global.postgresql.auth.database }}'
        {{- else }}
            - name: PG_URI
              value: 'postgresql://postgres:{{ .Values.postgresql.global.postgresql.auth.postgresPassword }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.global.postgresql.auth.database }}'
        {{- end }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}-servicex-app
        image: {{ .Values.app.image }}:{{ .Values.app.tag }}
        {{- if eq .Values.app.environment "dev" }}
        {{- if .Values.app.reload }}
        command: [ "./boot.sh", "--reload" ]
        {{- end }}
        {{- end }}
        env:
        - name: APP_CONFIG_FILE
          value: "/opt/servicex/app.conf"
        - name: FLASK_APP
          value: "/home/servicex/servicex_app/app.py"
        - name: INSTANCE_NAME
          value: "{{ .Release.Name }}"
        - name: LOG_LEVEL
          value: "{{ .Values.app.logLevel | upper }}"
        - name: ALLOWED_IMAGE_PREFIXES
          value: {{ .Values.app.allowedImagePrefixes | toJson | quote }}
        {{- if .Values.logging.logstash.enabled }}
        - name: LOGSTASH_HOST
          value: "{{ .Values.logging.logstash.host }}"
        - name: LOGSTASH_PORT
          value: "{{ .Values.logging.logstash.port }}"
        - name: LOGSTASH_PROTOCOL
          value: "{{ .Values.logging.logstash.protocol }}"
        {{- end }}
        {{- if .Values.logging.vector.enabled }}
        - name: VECTOR_HOST
          value: "127.0.0.1"
        - name: VECTOR_PORT
          value: "{{ .Values.logging.vector.port }}"
        {{- end }}
    {{- if .Values.secrets }}
        - name: OAUTH_METADATA_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: oauthMetadataURL
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: oauthClientID
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: oauthClientSecret
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: flaskSecretKey
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: jwtSecretKey
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: slackSigningSecret
        - name: SIGNUP_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: slackSignupWebhook
        - name: MAILGUN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: mailgunAPIKey
        - name: RMQ_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: rabbitmq-password
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: postgresql-password
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: accesskey
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: secretkey
    {{- end }}
    {{- if .Values.secrets }}
        - name: RABBIT_MQ_URL
          value: "amqp://user:$(RMQ_PASS)@{{ .Release.Name }}-rabbitmq:5672/%2F"
        - name: TRANSFORMER_RABBIT_MQ_URL
          value: "amqp://user:$(RMQ_PASS)@{{ .Release.Name }}-rabbitmq:5672/%2F?heartbeat=9000"
    {{- else }}
        - name: RABBIT_MQ_URL
          value: "amqp://user:{{ .Values.rabbitmq.auth.password }}@{{ .Release.Name }}-rabbitmq:5672/%2F"
        - name: TRANSFORMER_RABBIT_MQ_URL
          value: "amqp://user:{{ .Values.rabbitmq.auth.password }}@{{ .Release.Name }}-rabbitmq:5672/%2F?heartbeat=9000"
    {{- end }}
    {{- if .Values.secrets }}
          {{- if .Values.postgres.enabled }}
        - name: SQLALCHEMY_DATABASE_URI
          value: "postgresql://postgres:$(PG_PASS)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.global.postgresql.auth.database }}"
          {{- end }}
    {{- end }}
        tty: true
        stdin: true
        imagePullPolicy: {{ .Values.app.pullPolicy }}
        {{- if .Values.app.resources }}
        resources:
{{ toYaml .Values.app.resources | indent 10 }}
        {{- end }}

        volumeMounts:
          {{- if eq .Values.app.environment "dev" }}
          {{- if .Values.app.mountLocal }}
          - name: host-volume
            mountPath: /home/servicex
          {{- end }}
          {{- end }}
          - name: app-cfg
            mountPath: /opt/servicex
          - name: sqlite
            mountPath: /sqlite
          {{- if .Values.app.defaultUsers }}
          - name: users
            mountPath: /default_users
          {{ end }}


        ports:
          - containerPort: 5000

      {{- if .Values.logging.vector.enabled }}
      - name: vector
        image: {{ .Values.logging.vector.image }}:{{ .Values.logging.vector.tag }}
        imagePullPolicy: {{ .Values.app.pullPolicy }}
        args: [ "--config", "/etc/vector/vector.yaml" ]
        env:
        - name: VECTOR_SOCKET_PORT
          value: "{{ .Values.logging.vector.port }}"
        - name: VECTOR_LOG
          value: "{{ .Values.logging.vector.logLevel }}"
        - name: PG_HOST
          value: "{{ .Release.Name }}-postgresql"
        - name: PG_PORT
          value: "5432"
        - name: PG_USER
          value: "postgres"
        - name: PG_DB
          value: "{{ .Values.postgresql.global.postgresql.auth.database }}"
        {{- if .Values.secrets }}
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets }}
              key: postgresql-password
        {{- else }}
        - name: PG_PASS
          value: "{{ .Values.postgresql.global.postgresql.auth.postgresPassword }}"
        {{- end }}
        {{- if .Values.logging.vector.resources }}
        resources:
{{ toYaml .Values.logging.vector.resources | indent 10 }}
        {{- end }}
        volumeMounts:
          - name: vector-config
            mountPath: /etc/vector
            readOnly: true
          - name: vector-data
            mountPath: /vector-data-dir
      {{- end }}

      volumes:
        {{- if eq .Values.app.environment "dev" }}
        {{- if .Values.app.mountLocal }}
        - name: host-volume
          hostPath:
            path: /mnt/servicex/servicex_app
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}
        - name: app-cfg
          configMap:
            name:  {{ .Release.Name }}-flask-config
        - name: sqlite
          emptyDir: {}
        {{- if .Values.app.defaultUsers }}
        - name: users
          secret:
            secretName: users
        {{ end }}
        {{- if .Values.logging.vector.enabled }}
        - name: vector-config
          configMap:
            name: {{ .Release.Name }}-vector-config
        - name: vector-data
          emptyDir: {}
        {{- end }}
