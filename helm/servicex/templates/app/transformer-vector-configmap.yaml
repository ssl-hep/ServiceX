{{- if and .Values.logging.vector.enabled .Values.logging.vector.transformer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-transformer-vector-config
  labels:
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app: {{ .Release.Name }}
data:
  # Mounted into the `vector` container of every transformer worker pod by
  # servicex_app/servicex_app/transformer_manager.py. Two sources feed one sink:
  #   sidecar_logs  - JSON over a localhost socket from the python transformer sidecar
  #   science_logs  - the science container's stdout, tee'd to the shared volume by watch.sh
  # Both are forwarded to the release's vector aggregator, which owns the only
  # connection to postgres. Nothing here touches the database, so transformer pods
  # never see the postgres credentials.
  # Release-static values are templated in directly. Only the per-pod values are
  # left as ${VAR}s; Vector refuses to start if any of them is unset, so each is
  # either injected by transformer_manager or given a default here.
  vector.yaml: |
    data_dir: /vector-data-dir
    sources:
      sidecar_logs:
        type: socket
        mode: tcp
        address: 0.0.0.0:{{ .Values.logging.vector.transformer.port }}
        decoding:
          codec: json
      # Left on Vector's default fingerprint, a checksum of each file's first
      # line. That is only safe because watch.sh writes a unique header as
      # the first line of every chunk (dropped again in science_events).
      # Without it, chunks that start with the same output share one
      # fingerprint, and Vector skips the start of the new chunk with no
      # error. device_and_inode is not a substitute. Chunks are created
      # while old ones are being deleted, so a new chunk can get a deleted
      # chunk's inode while Vector still has that chunk's read position and
      # lose its first lines.
      science_logs:
        type: file
        include:
          - {{ .Values.transformer.outputDir }}/*/science.*.log
        read_from: beginning
        remove_after_secs: {{ .Values.logging.vector.transformer.scienceLogRemoveAfterSecs }}
    transforms:
      science_events:
        type: remap
        inputs: [science_logs]
        source: |
          msg = to_string(.message) ?? ""
          # watch.sh starts every chunk with a "servicex-chunk <name>" line.
          # The line has no log content. It is there so that each chunk's
          # first line, which is what science_logs fingerprints by default, is
          # unique, so Vector never confuses two chunks that start with the
          # same output. Abort here so the line never reaches the sink; remap
          # drops aborted events by default (drop_on_abort).
          if starts_with(msg, "servicex-chunk ") {
            abort
          }
          # Science stdout is unstructured, so severity is a guess. Ordinary
          # lines are DEBUG so they stay out of the way at the default filter.
          # No leading word boundary, so PascalCase exception names
          # (ValueError, KeyError) match; the trailing one keeps
          # "errors"/"terrorist" from matching. Over-flagging is the safer
          # failure here: the request page's log filter is a minimum severity,
          # so a DEBUG-classified stack trace would be invisible to anyone
          # filtering for errors.
          lvl = "DEBUG"
          if match(msg, r'(?i)(error|exception|fatal|critical|traceback)\b') {
            lvl = "ERROR"
          }
          . = {
            "timestamp": format_timestamp!(now(), format: "%+"),
            "level": lvl,
            "logger": "science",
            "instance": "{{ .Release.Name }}",
            "component": "science",
            "message": msg,
            "request_id": "${REQUEST_ID}",
            "extra": {
              "place": {
                "pod": "${POD_NAME-unknown}",
                "host": "${HOST_NAME-unknown}"
              }
            }
          }
    sinks:
      aggregator:
        type: vector
        inputs: [sidecar_logs, science_events]
        address: {{ include "servicex.vector.aggregatorHost" . }}:{{ .Values.logging.vector.aggregator.port }}
        batch:
          max_events: {{ .Values.logging.vector.batch.maxEvents }}
          timeout_secs: {{ .Values.logging.vector.batch.timeoutSecs }}
{{- end }}
