---
{{ if .Values.didFinder.atlasopenmagic.enabled}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-did-finder-atlasopenmagic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-did-finder-atlasopenmagic
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-did-finder-atlasopenmagic
    spec:
      initContainers:
        - name: check-url
          image: {{ .Values.app.checksImage }}
          env:
          - name: URL
            value: "http://{{ .Release.Name }}-servicex-app:8000"
      containers:
      - name: {{ .Release.Name }}-did-finder-atlasopenmagic
        image: {{ .Values.didFinder.atlasopenmagic.image }}:{{ .Values.didFinder.atlasopenmagic.tag }}
        imagePullPolicy: {{ .Values.didFinder.atlasopenmagic.pullPolicy }}
        {{- if .Values.didFinder.atlasopenmagic.resources }}
        resources:
{{ toYaml .Values.didFinder.atlasopenmagic.resources | indent 10 }}
        {{- end }}

        env:
          - name: INSTANCE_NAME
            value: {{ .Release.Name }}
        {{- include "servicex.didFinder.temporalEnv" (list . .Values.didFinder.atlasopenmagic.maxConcurrentLookups) | nindent 10 }}
        {{- include "servicex.didFinder.loggingEnv" . | trim | nindent 10 }}

{{ end }}
