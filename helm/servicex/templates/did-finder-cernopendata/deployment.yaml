---
{{ if .Values.didFinder.CERNOpenData.enabled}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-did-finder-cernopendata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-did-finder-cernopendata
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-did-finder-cernopendata
      {{- with .Values.didFinder.CERNOpenData.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.didFinder.CERNOpenData.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.didFinder.CERNOpenData.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.didFinder.CERNOpenData.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: check-url
          image: {{ .Values.app.checksImage }}
          env:
          - name: URL
            value: "http://{{ .Release.Name }}-servicex-app:8000"
      containers:
      - name: {{ .Release.Name }}-did-finder-cernopendata
        image: {{ .Values.didFinder.CERNOpenData.image }}:{{ .Values.didFinder.CERNOpenData.tag }}
        imagePullPolicy: {{ .Values.didFinder.CERNOpenData.pullPolicy }}
        {{- if .Values.didFinder.CERNOpenData.resources }}
        resources:
{{ toYaml .Values.didFinder.CERNOpenData.resources | indent 10 }}
        {{- end }}
        env:
          - name: INSTANCE_NAME
            value: {{ .Release.Name }}
        {{- include "servicex.didFinder.temporalEnv" (list . .Values.didFinder.CERNOpenData.maxConcurrentLookups) | nindent 10 }}
        {{- include "servicex.didFinder.loggingEnv" . | trim | nindent 10 }}
{{ end }}
