---
{{ if .Values.didFinder.rucio.enabled}}
  {{- if .Values.noCerts }}
    {{- fail "Rucio DID Finder requires x509 Certs to be installed" }}
  {{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-did-finder-rucio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-did-finder-rucio
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-did-finder-rucio
      {{- with .Values.didFinder.rucio.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.didFinder.rucio.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.didFinder.rucio.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.didFinder.rucio.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: did-finder
        image: {{ .Values.didFinder.rucio.image }}:{{ .Values.didFinder.rucio.tag }}
        imagePullPolicy: {{ .Values.didFinder.rucio.pullPolicy }}
        {{- if .Values.orchestrator.enabled }}
        # Temporal mode: serve the orchestrator's did-finder-rucio task queue.
        # Otherwise the image's default entrypoint runs the Celery worker.
        command: ["scripts/start_temporal_worker.sh"]
        {{- end }}
        {{- if .Values.didFinder.rucio.resources }}
        resources:
{{ toYaml .Values.didFinder.rucio.resources | indent 10 }}
        {{- end }}
        env:
          {{- if .Values.orchestrator.enabled }}
          - name: TEMPORAL_ADDRESS
            value: {{ include "servicex.temporal.address" . | quote }}
          - name: TEMPORAL_NAMESPACE
            value: {{ .Values.orchestrator.temporal.namespace | quote }}
          - name: SERVICEX_INTERNAL_ENDPOINT
            value: "http://{{ .Release.Name }}-servicex-app:8000/servicex/internal/transformation/"
          - name: DID_FINDER_MAX_CONCURRENT
            value: {{ .Values.didFinder.rucio.maxConcurrentLookups | quote }}
          {{- else if .Values.secrets }}
          - name: RMQ_PASS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets }}
                key: rabbitmq-password
          - name: BROKER_URL
            value: amqp://user:$(RMQ_PASS)@{{ .Release.Name }}-rabbitmq:5672/?heartbeat=9000
          {{- else }}
          - name: BROKER_URL
            value: amqp://user:{{ .Values.rabbitmq.auth.password }}@{{ .Release.Name }}-rabbitmq:5672/?heartbeat=9000
          {{- end }}
          {{- if .Values.didFinder.rucio.reportLogicalFiles }}
          - name: REPORT_LOGICAL_FILES
            value: "1"
          {{- end }}
          - name: RUCIO_LATITUDE
            value: "{{ .Values.didFinder.rucio.servicex_latitude }}"
          - name: RUCIO_LONGITUDE
            value: "{{ .Values.didFinder.rucio.servicex_longitude }}"
          {{- if .Values.didFinder.rucio.site }}
          - name: SITE_NAME
            value: "{{ .Values.didFinder.rucio.site }}"
          {{- end }}
          - name: RUCIO_RSE_EXPRESSION
            value: {{ .Values.didFinder.rucio.rseExpression | quote }}
          - name: RUCIO_IGNORE_AVAILABILITY
            value: {{ .Values.didFinder.rucio.ignoreAvailability | quote }}
          {{- if .Values.didFinder.rucio.replicaSorterEnabled }}
          - name: USE_REPLICA_SORTER
            value: "1"
          {{- if .Values.didFinder.rucio.geoIPURL }}
          - name: GEOIP_DB_URL
            value: {{ .Values.didFinder.rucio.geoIPURL }}
          {{- else }}
          {{- if .Values.didFinder.rucio.geoIPEdition -}}
          - name: GEOIP_DB_EDITION
            value: {{ .Values.didFinder.rucio.geoIPEdition }}
          {{- end -}}
          {{- if .Values.secrets -}}
          - name: GEOIP_DB_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets }}
                key: geoip-license-key
          {{- end }}
          {{- end }}
          {{- end }}
          {{- include "servicex.didFinder.loggingEnv" . | trim | nindent 10 }}
          - name: INSTANCE_NAME
            value: {{ .Release.Name }}
        volumeMounts:
          - name: rucio-cfg
            mountPath: /opt/rucio/etc/
          - name: x509-secret
            mountPath: /etc/grid-security-ro
            readOnly: true
      volumes:
        - name: rucio-cfg
          configMap:
            name: {{ .Release.Name }}-rucio-config
        - name: x509-secret
          secret:
            defaultMode: 292
            secretName: x509-proxy
{{- end }}
