{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-provisioning
  labels:
    app: {{ template "servicex.name" . }}
    chart: {{ template "servicex.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Pinned uid: the bundled dashboard references the datasource by uid,
        # so it must not be autogenerated.
        uid: servicex-prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:{{ .Values.monitoring.prometheus.service.port }}
        isDefault: true
        editable: false
        {{- if .Values.monitoring.tracing.enabled }}
        jsonData:
          # Turns a trace_id exemplar on a latency histogram into a link
          # straight to the trace in Tempo.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: servicex-tempo
        {{- end }}
      {{- if .Values.monitoring.tracing.enabled }}
      - name: Tempo
        uid: servicex-tempo
        type: tempo
        access: proxy
        url: http://{{ .Release.Name }}-tempo:3200
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          {{- if .Values.monitoring.tracing.tempo.serviceGraphs }}
          serviceMap:
            datasourceUid: servicex-prometheus
          tracesToMetrics:
            datasourceUid: servicex-prometheus
            spanStartTimeShift: -2m
            spanEndTimeShift: 2m
            tags:
              - key: service.name
                value: service
          {{- end }}
      {{- end }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: servicex
        orgId: 1
        folder: ServiceX
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboards
  labels:
    app: {{ template "servicex.name" . }}
    chart: {{ template "servicex.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: grafana
data:
{{ (.Files.Glob "dashboards/core/*.json").AsConfig | indent 2 }}
{{- if .Values.monitoring.tracing.enabled }}
  # Panels here query the Tempo datasource, so they only ship when it exists.
{{ (.Files.Glob "dashboards/tracing/*.json").AsConfig | indent 2 }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.postgresql.metrics.enabled }}
  # Needs the postgres_exporter sidecar, otherwise every panel is empty.
{{ (.Files.Glob "dashboards/postgres/*.json").AsConfig | indent 2 }}
{{- end }}
{{- end }}
