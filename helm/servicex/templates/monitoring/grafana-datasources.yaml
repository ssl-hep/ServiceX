{{- if .Values.monitoring.enabled }}
# Read by the grafana chart's datasource sidecar (grafana.sidecar.datasources).
# These live here rather than under `grafana.datasources` because the URLs need
# the release name and the Tempo entry is conditional -- neither of which a
# plain values file can express.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  labels:
    app: {{ template "servicex.name" . }}
    chart: {{ template "servicex.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: grafana
    {{ .Values.grafana.sidecar.datasources.label }}: {{ .Values.grafana.sidecar.datasources.labelValue | default "1" | quote }}
data:
  servicex-datasources.yaml: |
    apiVersion: 1
    datasources:
      # Pinned uids: the bundled dashboards reference their datasources by uid,
      # so these must not be autogenerated.
      - name: Prometheus
        uid: servicex-prometheus
        type: prometheus
        access: proxy
        url: {{ include "servicex.prometheus.url" . }}
        isDefault: true
        editable: false
      {{- if .Values.monitoring.tracing.enabled }}
      - name: Tempo
        uid: servicex-tempo
        type: tempo
        access: proxy
        url: http://{{ include "servicex.tempo.fullname" . }}:{{ .Values.tempo.tempo.server.http_listen_port | default 3200 }}
        editable: false
        jsonData:
          # Draws the span hierarchy of a trace as a graph. Derived from the
          # trace itself, so it needs no metrics generator.
          nodeGraph:
            enabled: true
      {{- end }}
{{- end }}
