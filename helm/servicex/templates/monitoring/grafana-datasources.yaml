{{- if .Values.monitoring.enabled }}
# Picked up by the grafana chart's datasource sidecar (sidecar.datasources).
# It lives here rather than in `grafana.datasources` because the URLs need the
# release name and the Tempo entry is conditional -- neither of which a plain
# values file can express.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  labels:
    app: {{ template "servicex.name" . }}
    chart: {{ template "servicex.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: grafana
    {{ .Values.grafana.sidecar.datasources.label }}: {{ .Values.grafana.sidecar.datasources.labelValue | default "1" | quote }}
data:
  servicex-datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Pinned uid: the bundled dashboards reference the datasource by uid,
        # so it must not be autogenerated.
        uid: servicex-prometheus
        type: prometheus
        access: proxy
        url: {{ include "servicex.prometheus.url" . }}
        isDefault: true
        editable: false
        {{- if .Values.monitoring.tracing.enabled }}
        jsonData:
          # Turns a trace_id exemplar on a latency histogram into a link
          # straight to the trace in Tempo.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: servicex-tempo
        {{- end }}
      {{- if .Values.monitoring.tracing.enabled }}
      - name: Tempo
        uid: servicex-tempo
        type: tempo
        access: proxy
        url: http://{{ include "servicex.tempo.fullname" . }}:{{ .Values.tempo.tempo.server.http_listen_port }}
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          {{- if include "servicex.tempo.serviceGraphsEnabled" . }}
          serviceMap:
            datasourceUid: servicex-prometheus
          tracesToMetrics:
            datasourceUid: servicex-prometheus
            spanStartTimeShift: -2m
            spanEndTimeShift: 2m
            tags:
              - key: service.name
                value: service
          {{- end }}
      {{- end }}
{{- end }}
