{{- /*
The orchestrator role's password, when the site has no `secrets` Secret. With
`secrets` set, put it there under orchestrator-db-password instead.
*/ -}}
{{- if and .Values.orchestrator.enabled (not .Values.secrets) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-orchestrator-db
  labels:
    app: {{ .Release.Name }}-orchestrator
type: Opaque
stringData:
  orchestrator-db-password: {{ required "orchestrator.database.password is required when secrets is unset" .Values.orchestrator.database.password | quote }}
{{- end }}
