{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orchestrator
  labels:
    app: {{ .Release.Name }}-orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-orchestrator
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-orchestrator
      annotations:
        # Restart on a change to the pilot pod settings, which are read at start-up
        checksum/transformer-config: {{ include (print $.Template.BasePath "/orchestrator/transformer-config.yaml") . | sha256sum }}
        {{- with .Values.orchestrator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.rbacEnabled }}
      serviceAccountName: {{ .Release.Name }}-orchestrator
      {{- end }}
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The worker drains in-flight tasks for up to 20s on SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
      - name: orchestrator
        image: {{ .Values.orchestrator.image }}:{{ .Values.orchestrator.tag }}
        imagePullPolicy: {{ .Values.orchestrator.pullPolicy }}
        {{- with .Values.orchestrator.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
          - name: TEMPORAL_ADDRESS
            value: {{ include "servicex.temporal.address" . | quote }}
          - name: TEMPORAL_NAMESPACE
            value: {{ .Values.orchestrator.temporal.namespace | quote }}
          - name: TEMPORAL_TASK_QUEUE
            value: {{ .Values.orchestrator.temporal.taskQueue | quote }}
          - name: LOG_LEVEL
            value: {{ .Values.orchestrator.logLevel | quote }}
          - name: INSTANCE_NAME
            value: {{ .Release.Name }}
          # Its own restricted role, never the postgres superuser. The password must
          # be URL-safe: it is substituted into DATABASE_URL as is.
          {{- include "servicex.orchestrator.dbEnv" . | trim | nindent 10 }}
          - name: DATABASE_URL
            value: "postgresql+asyncpg://{{ .Values.orchestrator.database.user }}:$(ORCHESTRATOR_DB_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.global.postgresql.auth.database }}"
          - name: DB_POOL_SIZE
            value: {{ .Values.orchestrator.database.poolSize | quote }}
          - name: DB_MAX_OVERFLOW
            value: {{ .Values.orchestrator.database.maxOverflow | quote }}
          {{- with .Values.orchestrator.stubDidFinderSchemes }}
          - name: STUB_DID_FINDER_SCHEMES
            value: {{ join "," . | quote }}
          {{- end }}
          {{- include "servicex.vector.env" . | trim | nindent 10 }}
          # What runs transformer pilots, and the pod settings for the kubernetes one
          - name: WORKER_BACKEND
            value: {{ .Values.orchestrator.workerBackend | quote }}
          - name: TRANSFORMER_CONFIG_FILE
            value: /etc/servicex-orchestrator/transformer.json
          {{- if .Values.objectStore.enabled }}
          # Passed on to the pilots, which write their output to the object store
          {{- if .Values.secrets }}
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets }}
                key: accesskey
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets }}
                key: secretkey
          {{- else }}
          - name: MINIO_ACCESS_KEY
            value: {{ .Values.minio.auth.rootUser | quote }}
          - name: MINIO_SECRET_KEY
            value: {{ .Values.minio.auth.rootPassword | quote }}
          {{- end }}
          {{- end }}
        volumeMounts:
          - name: transformer-config
            mountPath: /etc/servicex-orchestrator
            readOnly: true
      volumes:
        - name: transformer-config
          configMap:
            name: {{ .Release.Name }}-orchestrator-transformer
{{- end }}
