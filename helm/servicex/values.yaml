tempo:
  tempo:
    retention: 48h
    reportingEnabled: false
    server:
      http_listen_port: 3200
    ingester:
      max_block_duration: 5m
    metricsGenerator:
      enabled: true
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
  persistence:
    enabled: false
    size: 10Gi
  service:
    type: ClusterIP
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  config: |
    memberlist:
      cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
    multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
    usage_report:
      reporting_enabled: {{ .Values.tempo.reportingEnabled }}
    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention }}
    distributor:
      receivers:
        {{- toYaml .Values.tempo.receivers | nindent 8 }}
    ingester:
      {{- toYaml .Values.tempo.ingester | nindent 6 }}
    server:
      {{- toYaml .Values.tempo.server | nindent 6 }}
    storage:
      {{- toYaml .Values.tempo.storage | nindent 6 }}
    querier:
      {{- toYaml .Values.tempo.querier | nindent 6 }}
    query_frontend:
      {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
    overrides:
      {{- toYaml .Values.tempo.overrides | nindent 6 }}
      {{- if .Values.tempo.metricsGenerator.enabled }}
    metrics_generator:
      {{- if .Values.tempo.metricsGenerator.processor }}
      processor:
        {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
      {{- end }}
      {{- if .Values.tempo.metricsGenerator.registry }}
      registry:
        {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
      {{- end }}
      storage:
        path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
        remote_write:
          - url: http://{{ .Release.Name }}-prometheus-server:9090/api/v1/write
            send_exemplars: true
      traces_storage:
        path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
      {{- end }}

