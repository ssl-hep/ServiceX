logging:
  logstash:
    enabled: true
    host: servicex.atlas-ml.org
    port: 5959
    protocol: TCP
    monitor: "https://atlas-kibana.mwt2.org:5601/s/servicex/app/dashboards?auth_provider_hint=anonymous1#/view/c2cc1f30-4a5b-11ed-afcf-d91dad577662?embed=true&_g=(filters%3A!()%2CrefreshInterval%3A(pause%3A!t%2Cvalue%3A0)%2Ctime%3A(from%3Anow-24h%2Fh%2Cto%3Anow))&show-time-filter=true"
    # This URL format is tied to a parser in servicex_app/servicex_app/web/kibana_url_filter.py
    logs: "https://atlas-kibana.mwt2.org:5601/s/servicex/app/dashboards?auth_provider_hint=anonymous1#/view/bb682100-5558-11ed-afcf-d91dad577662?embed=true&_g=(filters:!(),refreshInterval:(pause:!t,value:1000),time:(from:now-24h%2Fh,to:now))&_a=(filters:!((query:(match_phrase:(instance:{{.Release.Name}}))),(meta:(index:'923eaa00-45b9-11ed-afcf-d91dad577662',key:level,negate:!t,params:(query:INFO),type:phrase),query:(match_phrase:(level:INFO))),(meta:(index:'923eaa00-45b9-11ed-afcf-d91dad577662',key:level,negate:!t,params:(query:DEBUG),type:phrase),query:(match_phrase:(level:DEBUG)))),index:'923eaa00-45b9-11ed-afcf-d91dad577662')"

  # A shared Vector aggregator deployment that writes log records into the Postgres
  # `log_messages` table. The app and the DID finders send their logs to the aggregator
  # directly over TCP; transformer pods run their own Vector (they need a file source for
  # the science container's stdout) and forward to the aggregator over Vector's native
  # protocol. DID finder rows are keyed on `dataset_id` rather than `request_id`.
  # The aggregator holds the only postgres connections. Requires postgres.enabled=true.
  vector:
    enabled: false
    image: timberio/vector
    tag: 0.48.0-debian        # must be >= 0.44.0 (postgres sink)
    port: 9000                # TCP port: app -> aggregator (newline-delimited JSON)
    logLevel: warn            # vector's own internal log level
    batch:
      maxEvents: 1000
      timeoutSecs: 5

    aggregator:
      replicas: 1
      port: 6000              # TCP port: transformer vectors -> aggregator (native protocol)
      apiPort: 8686           # vector's own API, used only by the health probes
      # Postgres connections held per replica. Unlike the old per-transformer-pod
      # sidecars, this is a fixed ceiling that does not grow with transform load.
      poolSize: 5
      # Vector worker threads. Left unset, Vector starts one per core on the node,
      # and its memory grows with the thread count. The aggregator carries every
      # transformer's logs, so it gets more than the per-pod vectors, but the
      # postgres writes are bounded by poolSize, not by threads.
      threads: 4
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
      buffer:
        # disk survives a postgres outage or an aggregator restart; memory does not.
        type: disk            # disk | memory
        maxSize: 268435488    # bytes, disk only. Vector's minimum is 256Mi.
        maxEvents: 500        # memory only
        whenFull: block       # block | drop_newest

    # Also run a Vector sidecar inside every transformer worker pod, shipping the
    # transformer sidecar's structured logs and the science container's stdout to
    # the aggregator. Requires logging.vector.enabled.
    transformer:
      enabled: false
      port: 9000              # localhost TCP port: transformer sidecar -> vector
      # This MUST carry a cpu request. The transformer HPA is autoscaling/v1 and
      # averages CPU utilization over every container in the pod, so a container
      # with no cpu request makes utilization unknown and stops autoscaling.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Vector worker threads. Left unset, Vector starts one per core it can see,
      # and with no cpu limit that is every core on the node. Memory grows with
      # the thread count, so on a many-core node vector blows through its memory
      # limit and is OOMKilled at startup. One transform's logs need very little.
      threads: 2
      # Seconds Vector waits before deleting a science log chunk it has fully read.
      scienceLogRemoveAfterSecs: 300
