    image: sslhep/servicex-did-finder
    pullPolicy: Always
    reportLogicalFiles: false
    # Rucio RSE expression used to filter which replicas are returned.
    # This is required - the DID finder will not start without it.
    # The default value below is valid for ATLAS only. Other experiments
    # must override it with an expression for their own Rucio instance.
    rseExpression: 'istape=False&(*\type=SPECIAL|cloud=CERN)'
    ignoreAvailability: false
    rucio_host: https://voatlasrucio-server-prod.cern.ch:443
    servicex_latitude: 41.78
    servicex_longitude: -87.7
