[tool.poetry]
name = "servicex-app"
version = "1.6.0-a1"
homepage = "https://iris-hep.org"
license = "BSD"
maintainers = ["ServiceX Team <bengal1@illinois.edu>"]
authors = []
description = "REST Frontend to ServiceX"
readme = "README.rst"

packages = [{include = "servicex_app"}]

[tool.poetry.dependencies]
python = "~3.10"
markupsafe = "^2.1.1"
jinja2 = "^3.1.5"
flask = "^2.3.3"
werkzeug = "^3.1.6"
flask-wtf = "^1.0.1"
flask-cors = "^6.0.0"
wtforms = "^3.0.1"
email-validator = "^1.3.0"
Celery = "^5.2.0"
tenacity = "^9.0.0"
pika = "^1.3.1"
flask-restful = "^0.3.9"
flask-jwt-extended = "^4.4.4"
passlib = "^1.7.4"
flask-sqlalchemy = "^3.0.2"
kubernetes = "^25.3.0"
cryptography = "^46.0.5"
bootstrap-flask = "^2.1.0"
blinker = "^1.5"
minio = "^7.1.12"
flask-migrate = "^3.1.0"
psycopg2 = "^2.9.5"
python-logstash = "^0.4.8"
humanize = "^4.4.0"
gunicorn = "^23.0.0"
requests-toolbelt = "^1.0.0"
urllib3 = "^2.6.3"
requests = "^2.32"
authlib = "^1.6.9"
flask-moment = "^1.0.6"
setuptools = "^81"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
flake8 = "^5.0.4"
pytest-mock = "^3.10.0"
pytest = "^7.2.0"
pytest-flask = "^1.2.0"
pytest-celery = "^1.2.1"
coverage = "^6.5.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^2.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true
source = ["servicex_app"]
