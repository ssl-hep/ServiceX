{% extends "base.html" %}
{% block content %}
<div class="col-md-12">
  <h2>Admin Dashboard</h2>
  <h4 class="mt-4">Users</h4>
  <table class="table table-striped table-sm">
    <thead class="thead-dark">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Institution</th>
        <th>Admin</th>
        <th>Pending</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.institution }}</td>
        <td>{{ "Yes" if user.admin else "No" }}</td>
        <td>{{ "Yes" if user.pending else "No" }}</td>
        <td><a href="/admin/usermodel/edit/?id={{ user.id }}" class="btn btn-sm btn-outline-primary">Edit</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
