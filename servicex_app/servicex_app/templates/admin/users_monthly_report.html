{% extends 'admin/master.html' %}

{% block body %}
<h2>Users Monthly Report</h2>
<p class="text-muted">Generates a CSV of all users who have submitted at least one transform.</p>
<form method="POST" action="{{ url_for('usersmonthlyreport.generate_download') }}">
  {% for param in params %}
  <div class="mb-3">
    <label class="form-label">{{ param.name | title }}</label>
    <input class="form-control" style="width: auto;" type="number" name="{{ param.name }}" value="{{ param.default }}">
    {% if param.help %}<div class="form-text">{{ param.help }}</div>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Generate Report</button>
</form>
{% endblock %}
